# Render Blueprint: the API (which also serves the web app) and the background worker run from the same Docker image.
# Secrets are marked sync:false, so Render asks for them in the dashboard and they never live in git.
services:
  - type: web
    name: school-api
    runtime: docker
    plan: free               # pre-launch: sleeps after 15 idle minutes. Switch to starter before real school use
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_TARGET, value: supabase }
      - { key: DATABASE_URL, sync: false }        # school_app URL ...?sslmode=verify-full&sslrootcert=bundled
      - { key: AUTH_MODE, value: password }
      - { key: MFA_REQUIRED, value: "false" }     # pilot decision; see docs/DEPLOYMENT.md
      - { key: MFA_ENCRYPTION_KEY, generateValue: true }
      - { key: TRUST_PROXY, value: "2" }          # Render's load balancer + the Vercel proxy in front of it
      - { key: ALLOWED_HOSTS, value: school-api-jkjm.onrender.com }
      - { key: ALLOWED_ORIGINS, sync: false }     # https://<your-vercel-domain>
